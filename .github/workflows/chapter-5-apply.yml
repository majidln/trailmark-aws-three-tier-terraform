name: Chapter 5 Apply

on:
  push:
    branches:
      - main
    paths:
      - 'trailmark/chapter-5-pipeline/**'
      - '.github/workflows/chapter-5-apply.yml'

permissions:
  contents: read      
  id-token: write    

env:
  APPLY_ROLE_ARN: ${{ vars.APPLY_ROLE_ARN }}

concurrency:
  group: chapter-5-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    environment: chapter-5-deploy

    defaults:
      run:
        working-directory: trailmark/chapter-5-pipeline/stack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Confirm which identity we are using
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan

      - name: Show outputs
        run: terraform output
