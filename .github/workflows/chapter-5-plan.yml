name: Chapter 5 Plan

on:
  pull_request:
    paths:
      - 'trailmark/chapter-5-pipeline/**'
      - '.github/workflows/chapter-5-plan.yml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  # A repository VARIABLE, not a secret. A role ARN is an address, not a
  # credential — the trust policy is what protects the role. Variables are not
  # masked, so the value stays readable in logs when something goes wrong.
  PLAN_ROLE_ARN: ${{ vars.PLAN_ROLE_ARN }}

jobs:
  plan:

    defaults:
      run:
        working-directory: trailmark/chapter-5-pipeline/stack

    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color